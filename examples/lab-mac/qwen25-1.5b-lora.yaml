# Mac Lab — Qwen2.5-1.5B-Instruct LoRA on UltraChat
#
# NOT White Circle Halo CUDA training. This is a fork-local lab config
# for Apple Silicon experimentation using PyTorch MPS.
#
# Launch:
#   python examples/lab-mac/train_sft_lora.py examples/lab-mac/qwen25-1.5b-lora.yaml
#
# Memory: ~16GB unified on Apple Silicon (32GB+ recommended)
# Time: ~15 min for 20 steps on M5 Pro

# --- Model ---
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct

# --- Dataset ---
dataset_name: HuggingFaceH4/ultrachat_200k
dataset_split: "train_sft[:1000]"
conversation_field: messages

# --- Sequence Length ---
max_length: 2048

# --- LoRA ---
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# --- Training ---
max_steps: 20
per_device_train_batch_size: 1  # smaller batch for larger model
gradient_accumulation_steps: 8
learning_rate: 5.0e-05  # slightly lower for larger model
warmup_steps: 5
weight_decay: 0.01
lr_scheduler_type: cosine
seed: 42

# --- Memory ---
gradient_checkpointing: true

# --- Output ---
output_dir: ""  # auto-generated with timestamp
save_steps: 10
save_total_limit: 2

# --- Logging ---
logging_steps: 1
report_to: none  # set to "wandb" if you want W&B tracking
